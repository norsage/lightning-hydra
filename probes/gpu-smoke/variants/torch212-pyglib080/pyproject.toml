# GPU smoke variant: see probes/gpu-smoke/README.md.
[project]
name = "gpu-smoke-212-pyglib080"
version = "0"
requires-python = ">=3.12"
dependencies = ["torch>=2.12,<2.13", "torch-geometric>=2.8", "pyg-lib==0.8.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.12.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.12.0+cu126.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
pyg-lib = [
  { index = "pyg-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pyg-cu126", marker = "sys_platform == 'linux'" },
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
