[project]
name = "__pkg__"
version = "0.1.0"
# Python: .python-version (scaffold.py --python); the upper bound is the first
# version the skeleton does not run on (SKILL.md, "Environment").
requires-python = ">=3.12,<3.14"
dependencies = [
  # torch 2.11 + pyg-lib 0.6.0 (CUDA 12.6): the newest pair whose kernels run
  # on NVIDIA driver 535 (CUDA 12.2). pyg-lib 0.7.0 and later fail on that
  # driver with `device kernel image is invalid`.
  # Versions for other drivers: references/torch-gpu.md.
  "torch>=2.11,<2.12",
  # The torch-2.11.0 index on data.pyg.org also has 0.7–0.9: == holds the version.
  "pyg-lib==0.6.0",
  # No torch-scatter/torch-sparse/torch-cluster: their operations are in torch
  # and pyg-lib, and there are no wheels for recent torch.
  "torch-geometric>=2.8",
  "lightning>=2.5",
  "hydra-core>=1.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pyright>=1.1.400"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/__pkg__"]

# Linux: torch from the PyTorch index for CUDA 12.6. torch from PyPI for Linux
# is built for CUDA 13 and needs driver 580+. On Mac, torch from PyPI (MPS).
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# pyg-lib is only on data.pyg.org: a flat index per torch + CUDA pair.
# The macOS arm64 wheels are in the CPU index.
[[tool.uv.index]]
name = "pyg-cpu"
url = "https://data.pyg.org/whl/torch-2.11.0+cpu.html"
format = "flat"
explicit = true

[[tool.uv.index]]
name = "pyg-cu126"
url = "https://data.pyg.org/whl/torch-2.11.0+cu126.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
pyg-lib = [
  { index = "pyg-cpu", marker = "sys_platform == 'darwin'" },
  { index = "pyg-cu126", marker = "sys_platform == 'linux'" },
]

[tool.uv]
# Lock for Mac and Linux only: pyg-lib has no Windows wheels, and without
# environments `uv lock` fails.
environments = ["sys_platform == 'darwin'", "sys_platform == 'linux'"]
# Without this uv picks the highest local version of pyg-lib (+pt211cpu, Linux
# only), and `uv sync` fails on Mac. Here uv must find a wheel for both.
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 120

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
